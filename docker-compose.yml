version: '3.8'

services:
  # Local PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: job_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: job_sandbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_sandbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local Redis Cache & Queue
  cache:
    image: redis:7-alpine
    container_name: job_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
